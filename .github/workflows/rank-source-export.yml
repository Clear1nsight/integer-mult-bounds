name: Pinned rank-transform source export
on:
  push:
    branches: [research/rank-profile-circuit-transforms-20261019]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch public pinned task catalogue
        run: |
          mkdir -p rank-catalog/docs/research
          curl --fail --silent --show-error --max-time 45 https://raw.githubusercontent.com/CrocSwap/integer-mult-bounds/20ecf2891d80b5acf18d980b2164fb44ea7faa90/docs/research/agent-task-catalog.json -o rank-catalog/docs/research/agent-task-catalog.json
          sha256sum rank-catalog/docs/research/agent-task-catalog.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rank-catalog
          path: rank-catalog/
          retention-days: 3
