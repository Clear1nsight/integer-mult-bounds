name: P104 consumer source inspection
on:
  push:
    branches: [validation/p104-consumer-inspect-20261019]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20ecf2891d80b5acf18d980b2164fb44ea7faa90
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p104-native-channel/inputs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bind the exact cleanup matrix and factorisation
        run: |
          python -B - <<'PY'
          import json,hashlib,itertools,collections
          from fractions import Fraction as F
          from pathlib import Path
          root=Path('research/p104-native-channel/inputs')
          raw=(root/'LOWRANK-WITNESS.json').read_bytes()
          if hashlib.sha256(raw).hexdigest() != '0f541bef7f19fdeffd67157684e9f03d785f42c89973632f508fc1a0452b580e': raise ValueError('pin')
          w=json.loads(raw); p=w['program']; kinds=collections.Counter(e[0] for e in p)
          print('OP_SCHEMA',json.dumps({k:next(e for e in p if e[0]==k) for k in kinds}))
          print('OP_COUNTS',json.dumps(kinds,sort_keys=True))
          print('PRE_CUT_LAST',json.dumps(list(enumerate(p[3632:3642],3632))))
          fixture=json.loads((root/'P104-FIXTURE.json').read_text())['section4_explicit_P104']
          roots=set()
          for a,b in itertools.combinations(range(8),2):
            for sign in (-1,1):
              v=[0]*8;v[a]=2;v[b]=2*sign;roots.add(tuple(v))
          for s in itertools.product((-1,1),repeat=7):
            if s.count(-1)%2==0: roots.add((1,)+s)
          ports=sorted(roots-{tuple(x) for x in fixture['F0']+fixture['C']})
          J=[0,1,3,6,22,31,93,103];N=[i for i in range(104) if i not in J]
          B=[[F(sum(a*b for a,b in zip(ports[j],ports[n])),8) for n in N] for j in J]
          D=[[F(0)]*104 for _ in range(8)]
          for e in p[3642:]:
            if e[0]!='add' or not e[1].startswith('Q') or not e[2].startswith('X'): raise ValueError('suffix')
            D[int(e[1][1:])][int(e[2][1:])]+=F(e[3])
          T=[[r[j] for j in J] for r in D]
          if not all(D[k][n]==sum(T[k][b]*B[b][a] for b in range(8)) for k in range(8) for a,n in enumerate(N)): raise ValueError('factor')
          print('CLEANUP_FACTOR',json.dumps([[str(x) for x in r] for r in T]))
          print('FACTOR_COUNTS',sum(x!=0 for r in D for x in r),sum(x!=0 for r in T for x in r))
          print('SOURCE_FILE_SIZES',len(raw),len((root/'P104-FIXTURE.json').read_bytes()))
          print('FROZEN_MAIN',__import__('subprocess').check_output(['git','rev-parse','HEAD']).decode().strip())
          PY
          git diff --exit-code
